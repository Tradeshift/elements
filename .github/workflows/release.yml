name: Publish packages

on:
  push:
    branches:
      - master

jobs:
  publish:
    if: "startsWith(github.event.commits[0].message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Release type
        id: release
        run: |
          # A beta (any prerelease, e.g. 0.41.1-beta.0) goes to GitHub Packages only, not to npmjs.org.
          VERSION=$(node -p 'require("./lerna.json").version')
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (prerelease: $PRERELEASE)"

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap monorepo
        run: npm run lerna:bootstrap:ci

      - name: Build
        run: npm run build:prod

      - name: Publish to NPM
        if: steps.release.outputs.prerelease != 'true'
        run: npm run lerna-publish-ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN_PUBLIC }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          cache: npm
          scope: '@tradeshift'

      - name: Publish to Github Packahes
        run: npm run lerna-publish-ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
